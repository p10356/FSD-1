<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border rules="cols" bgcolor="aqua" align="justify" height="500px" width="700px">
        <tr align="center">
            <td bgcolor="yellow">1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr bgcolor="red">
            <td align="center">4</td>
            <td>5</td>
            <td>6</td>
        </tr>
        <tr>
            <th>7</th>
            <th>8</th>
            <th>9</th>
        </tr>
    </table>
    <table border rules="all" bgcolor="aqua" align="justify" height="500px" width="700px">
        <thead>
            <tr>
                <th>1</th>
                <th>2</th>
                <th>3</th>
            </tr>
        </thead>
        <tbody align="center">
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
            <tr>
                <td>7</td>
                <td>8</td>
                <td>9</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>this</th>
                <th>is</th>
                <th>footer</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
