<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task2</title>
    <style>
        table{
            text-align: center;
        }
        td{
            height: 50px;
            width: 50px;
        }
        .design{
            height: 100px;
            width: 100px;
            background: #F00;
        }
    </style>
</head>
<body>
    <table border rules="all">
        <tr>
            <td class="design">A</td>
            <td>B</td>
            <td>C</td>
            <td class="design">D</td>
        </tr>
        <tr>
            <td>&nbsp;</td>
            <td colspan="2" rowspan="2" class="design">E</td>
            <td>&nbsp;</td>
        </tr>
        <tr>
            <td rowspan="2" class="design">F</td>
            <td rowspan="2" class="design">I</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
        </tr>
    </table>
</body>
</html>
